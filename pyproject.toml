[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "paperhere"
version = "0.2.0"
description = "A local and remote Neovim LaTeX workflow with live browser preview"
requires-python = ">=3.10"

[project.scripts]
paperhere = "paperhere.cli:main"

[tool.setuptools.package-data]
paperhere = [
    "static/*.html",
    "static/*.css",
    "static/*.js",
    "static/vendor/*",
    "static/cmaps/*",
    "nvim_bootstrap.lua",
    "nvim/*.md",
    "nvim/plugin/*.lua",
    "nvim/lua/paperhere/*.lua",
    "nvim/autoload/vimtex/view/*.vim",
]
